name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: 'true'
          include_fix_links: 'true'
          prompt: |
            Review this pull request thoroughly. This is a SvelteKit + TypeScript application
            (Svelte 5 with runes, Vite, Node adapter for SSR).

            ## What to check

            **Correctness**
            - Logic errors, broken edge cases, subtle regressions
            - Svelte 5 reactivity: correct use of $state(), $derived(), $effect();
              mutations that won't trigger re-renders (e.g. array.push without reassignment)
            - SvelteKit load functions: server vs client load separation,
              data not accidentally leaked from +page.server.ts to the client
            - URL routing: dynamic [location]/[[timestamp]] params parsed correctly,
              RFC 3339 timestamps with mandatory timezone offset

            **TypeScript**
            - No `any` types — the API response must be fully typed
            - Proper null/undefined handling (lineage fields are nullable)
            - Type narrowing instead of type assertions where possible

            **Security**
            - XSS via unsanitized SVG or HTML injection
            - User input flowing into URLs or API calls without validation
            - Secrets or internal URLs in client-side code

            **API contract**
            - FE resolves city slugs to (lat, lon) locally from cities.json — never sends city names to the API
            - Timestamps sent to the API are RFC 3339 with timezone
            - API responses handled gracefully when fields are null/missing

            **CSS & layout**
            - Scoped styles only — no global selectors reaching into child components
            - CSS custom properties used for theming

            ## What NOT to check
            - Formatting and import ordering (Prettier + ESLint handle this)
            - Pre-existing tech debt unrelated to this PR's changes

            ## Verification
            You can run these commands to verify the changes don't break anything:
            - `npx svelte-check --tsconfig ./tsconfig.json` — type checking
            - `npm run test` — vitest unit tests
            - `npm run lint` — eslint + prettier check
            - `npm run build` — production build succeeds

            ## Output format
            - Post specific issues as inline comments on the relevant diff lines.
              Tag severity: 🔴 bug/must-fix, 🟡 nit/suggestion, 🟣 pre-existing.
            - Post a single summary comment on the PR with: what the PR does well,
              overall assessment, and a count of findings by severity.
          claude_args: |
            --model claude-opus-4-6
            --max-turns 12
            --allowedTools "Read,Grep,Glob,Bash(npx svelte-check:*),Bash(npm run test:*),Bash(npm run lint:*),Bash(npm run build:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
