name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        env:
          PR_FROM_PULL: ${{ github.event.pull_request.number }}
          PR_FROM_ISSUE: ${{ github.event.issue.number }}
        run: |
          NUM="${PR_FROM_PULL:-$PR_FROM_ISSUE}"
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"

      - name: Pre-fetch prior PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUM}/comments?per_page=100" > prior-inline-comments.json || echo '[]' > prior-inline-comments.json
          gh api "repos/${REPO}/issues/${PR_NUM}/comments?per_page=100" > prior-issue-comments.json || echo '[]' > prior-issue-comments.json
          gh api "repos/${REPO}/pulls/${PR_NUM}/reviews?per_page=100" > prior-reviews.json || echo '[]' > prior-reviews.json
          gh api graphql -f query='
            query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $num) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      isOutdated
                      comments(first: 50) {
                        nodes {
                          id
                          databaseId
                          author { login }
                          body
                          path
                          line
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="${REPO%/*}" -f repo="${REPO#*/}" -F num="${PR_NUM}" > prior-review-threads.json || echo '{}' > prior-review-threads.json

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are reviewing a SvelteKit + TypeScript application (Svelte 5 with
            runes, Vite, Node adapter for SSR). The repo is a thin display layer
            for the Buttprint API — no environmental data processing happens here.

            ## Mode detection

            Event: ${{ github.event_name }}
            Action: ${{ github.event.action }}
            PR number: ${{ steps.pr.outputs.number }}

            This workflow ONLY triggers on `@claude` mentions in PR comments / review
            comments / reviews. There is no auto-review on push. The user is explicitly
            inviting you, like a human reviewer.

            Read the trigger body first:
            - `issue_comment` → `${{ github.event.comment.body }}`
            - `pull_request_review_comment` → `${{ github.event.comment.body }}`
            - `pull_request_review` → `${{ github.event.review.body }}`

            Decide intent:
            - "review", "re-review", "take a look", "look again", or just `@claude` alone
              on the PR conversation tab → **PR review mode** (auto-detects first vs
              re-review from prior comments).
            - A specific question, task, or debugging request → **mention response mode**.

            Maximize parallel tool calls throughout. There is NO Node.js installed
            in this workflow — do NOT run `npm`, `npx`, or `node`. Verification is
            delegated to the `Test` CI workflow (see "Verification" below).

            ## PR review mode

            ### Step 1 — load prior conversation

            If the workspace contains these files (it will, on PR events with a PR number):
            - `prior-inline-comments.json` — REST: PR review comments (inline diff comments).
            - `prior-issue-comments.json` — REST: PR issue-level (general) comments.
            - `prior-reviews.json` — REST: review submissions (approve/request-changes/comment).
            - `prior-review-threads.json` — GraphQL: review threads with `id`, `isResolved`,
              and per-comment `id` (node ID) and `databaseId`. Use `id` for GraphQL mutations.

            READ ALL FOUR FILES IN PARALLEL FIRST. They are your conversation history.

            Your bot identity is whatever login posted prior comments and matches one of:
            `claude[bot]`, `github-actions[bot]`. If any prior comments match, this is a
            **RE-REVIEW**. Otherwise it is a **FIRST REVIEW**.

            ### Step 2A — first review

            1. `gh pr diff ${{ steps.pr.outputs.number }}` — get the diff.
            2. Read all changed files in parallel.
            3. Check CI status (see "Verification" below) in parallel with file reads.
            4. Post inline comments per the rules in "What to check".
            5. Post the summary comment (see "Output format").

            ### Step 2B — re-review protocol

            Run BEFORE reviewing the new diff. The goal: behave like a returning human
            reviewer who tracked the prior conversation.

            **Rule 1 — Verify each prior bot finding.**
            For every inline comment authored by your bot identity, check the current state
            of that file/line in the new HEAD:

            - **Fixed correctly** → reply on the thread with a one-line ack referencing the
              resolving SHA, then resolve the thread:
              ```
              gh api graphql -f query='mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) {
                  thread { isResolved }
                }
              }' -f id="<thread node id from prior-review-threads.json>"
              ```
              Reply via:
              `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments/<comment_id>/replies -f body="..."`
              (use `databaseId` from the GraphQL response or `id` from `prior-inline-comments.json`).
            - **Attempted but incorrect** → reply explaining specifically what is still
              wrong. DO NOT resolve the thread. If the issue moved to a different line,
              post a fresh inline comment at the new location.
            - **Still present, not addressed** → reply with "Still present after <SHA>"
              and a one-line restatement. DO NOT post a duplicate inline comment.
            - **Made moot** (line/file removed) → resolve the thread, optionally with a
              brief "moot — line removed in <SHA>" reply.

            **Rule 2 — Treat human comments as authoritative context.**
            For human-authored comments on bot threads or anywhere on the PR:

            - "won't fix" / "by design" / "intentional" / "deferred" / "wontfix" → respect
              it. Do NOT re-flag the underlying concern on this re-review or future ones.
            - Push back ONLY when there is a concrete, technical reason the human's
              reasoning is wrong (e.g., security issue dismissed as "by design", or a
              "won't fix" on a correctness bug with reproduction steps available).
            - Frame push-back as a question, not a contradiction:
              "Could you clarify how this handles X? Looking at <file:line>, I see
              <specific concern>." Cite line numbers and code.
            - NEVER push back on style or preference disagreements.

            **Rule 3 — Engage with other reviewers.**
            For comments authored by humans or other bots NOT replying to your threads:
            read them. If you notice a logical error, factual mistake, or inconsistency,
            post a polite reply with the specific concern. Cite line numbers and code.
            Do not nitpick. Do not engage on style.

            **Rule 4 — New findings only.**
            For genuinely new issues introduced by the new commits, post fresh inline
            comments. NEVER re-post a finding that already has a thread (resolved or not).

            **Rule 5 — Summary.**
            For first review: header `### Review of <SHA>`.
            For re-review: header `### Re-review of <SHA>` plus a counts line:
            `Resolved: N · Still open: N · New findings: N · Pushed back on: N`.

            ## What to check

            **Correctness**
            - Logic errors, broken edge cases, subtle regressions
            - Svelte 5 reactivity: correct use of `$state()`, `$derived()`, `$effect()`;
              mutations that won't trigger re-renders (e.g. `array.push` without reassignment)
            - SvelteKit load functions: server vs client load separation,
              data not accidentally leaked from `+page.server.ts` to the client
            - URL routing: dynamic `[location]/[[timestamp]]` params parsed correctly,
              RFC 3339 timestamps with mandatory timezone offset

            **TypeScript**
            - No `any` types — the API response must be fully typed
            - Proper null/undefined handling (lineage fields are nullable per-variable)
            - Type narrowing instead of type assertions where possible

            **Security**
            - XSS via unsanitized SVG or HTML injection (`{@html}`, raw SVG insertion)
            - User input flowing into URLs or API calls without validation
            - Secrets or internal URLs leaking into client-side code

            **API contract**
            - FE resolves city slugs to (lat, lon) locally from `cities.json` —
              never sends city names to the API
            - Timestamps sent to the API are RFC 3339 with timezone
            - API responses handled gracefully when fields are null/missing

            **CSS & layout**
            - Scoped styles only — no global selectors reaching into child components
            - CSS custom properties used for theming

            ## What NOT to check
            - Formatting and import ordering (Prettier + ESLint handle this)
            - Pre-existing tech debt unrelated to this PR's changes

            ## Verification

            CI is delegated. The `Test` workflow (`.github/workflows/ci.yml` → `test.yml`)
            runs `npm run lint`, `npm run check` (svelte-check), `npm run test`, and
            `npm run build` on every PR. Do NOT re-run these — Node is not installed
            in this workflow.

            Instead:

            1. `gh pr checks ${{ steps.pr.outputs.number }}` — see overall status.
            2. If any check is **failing**: find the run ID and read failed logs:
               `gh run view <run_id> --log-failed`
               (or `gh api repos/${{ github.repository }}/actions/runs/<id>/jobs`
               for structured data). Incorporate failure context into the review.
            3. If any check is **pending** (CI hasn't finished): note
               "CI still running — review of static diff only" in the summary and
               proceed. Do NOT block or wait.

            ## Output format
            - Inline comments tag severity: 🔴 bug/must-fix, 🟡 nit/suggestion, 🟣 pre-existing.
            - Summary: post as a fresh top-level PR comment via
              `gh api repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments -f body="..."`.
              Each review gets its own summary comment — do NOT update or replace prior
              summaries. Old summaries are intentional history.
              Body structure:
              - First line: `### Review of <SHA>` (first review) or `### Re-review of <SHA>` (re-review).
              - One-line assessment.
              - What the PR does well (1–2 bullets).
              - For re-reviews, a counts line:
                `Resolved: N · Still open: N · New findings: N · Pushed back on: N`.

            ## Mention response mode

            Read the trigger body and do what is asked. Common requests: explain a piece
            of code, debug a failing test, suggest an approach, answer a design question,
            or read CI logs and report.

            Post your response as a reply on the same thread, NOT as a fresh top-level
            comment:
            - `pull_request_review_comment` (inline thread reply):
              `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments/<comment_id>/replies -f body="..."`
            - `issue_comment` (PR Conversation tab):
              `gh api repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments -f body="..."`
            - `pull_request_review` (submitted review with `@claude` in body):
              post a top-level PR comment via the `issues/.../comments` endpoint above.

            Do not post a top-level summary comment in this mode — those are reserved
            for full reviews.
          claude_args: |
            --model claude-opus-4-7
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(gh pr:*),Bash(gh run:*),Bash(gh api:*),mcp__github_inline_comment__create_inline_comment"
