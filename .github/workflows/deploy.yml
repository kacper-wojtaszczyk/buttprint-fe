name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: rg.nl-ams.scw.cloud/climacterium

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          registry: rg.nl-ams.scw.cloud
          username: nologin
          password: ${{ secrets.SCALEWAY_API_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push buttprint-fe
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/buttprint-fe:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/buttprint-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printenv KUBECONFIG_CONTENT > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kapsule
        env:
          SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          kubectl set image deployment/buttprint-fe \
            buttprint-fe=${{ env.REGISTRY }}/buttprint-fe:${SHA}

      - name: Wait for rollout
        run: kubectl rollout status deployment/buttprint-fe --timeout=120s
